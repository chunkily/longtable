name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      # assets.go embeds web/build, and cmd/longtable imports it, so no Go
      # command touching ./cmd/... compiles until the frontend has been
      # built — not build, not vet, not test. web/build is gitignored, so a
      # fresh checkout never has it and the embed fails with
      # "pattern all:web/build: no matching files found".
      - working-directory: web
        run: npm ci
      - working-directory: web
        run: npm run build
      # Scoped to internal/... and cmd/... rather than ./... — the repo
      # root also contains web/node_modules, which the go tool would
      # otherwise walk looking for packages.
      # -tags nodynamic keeps the WebP encoder on its transpiled-Go path
      # instead of picking up a system libwebp if the runner happens to
      # have one, so CI exercises what a Host's binary actually does.
      # See planning/decisions/0005-webp-reencoding-library.md.
      - run: go build -tags nodynamic ./internal/... ./cmd/...
      - run: go vet -tags nodynamic ./internal/... ./cmd/...
      - run: go test -tags nodynamic ./internal/... ./cmd/... -race -cover

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - working-directory: web
        run: npm ci
      # Same reason as the backend job: run-backend.mjs builds
      # ./cmd/longtable, which cannot compile until web/build exists. The
      # specs themselves are served by vite, not by this build.
      - working-directory: web
        run: npm run build
      - working-directory: web
        run: npx playwright install --with-deps chromium
      - working-directory: web
        run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7
